[project]
name = "apigrunn"
version = "0.1.0"
description = "Python API over the aiGrunn conference website, backed by a local SQLite cache."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ email = "jaap@evoso.nl" }]
keywords = ["apigrunn", "conference", "talks", "groningen", "scraper"]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://www.aigrunn.org/"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apigrunn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not network'"
markers = ["network: test hits the live aigrunn.org site"]
